# 선택: AI 프롬프트·검증·평가 파일이 바뀐 PR에서 소규모 eval을 돌려 결과를 아티팩트·작업 요약으로 남긴다. 필수 검사가 아니다.
# 준비: ANTHROPIC_API_KEY(와 필요 시 ANTHROPIC_BASE_URL) 시크릿. 비용 때문에 표본 15자·1회 (판정 포함 약 $0.2).
# 숫자를 믿을 수 없는 실행(생성 전부 실패·판정 90% 미만·JMdict 못 받음)은 스크립트가 실패로 끝낸다.
name: AI eval

on:
  pull_request:
    paths:
      - "src/lib/ai/**"
      - "src/lib/cards/**"
      - "src/lib/eval/**"
      - "src/data/**"
      - "evals/**"
      - "scripts/eval-kanji.ts"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
    steps:
      # 시크릿을 받을 수 없는 PR(포크 등)은 실패 대신 건너뛴다
      - if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::ANTHROPIC_API_KEY 시크릿이 없어 eval을 건너뜁니다"
      - if: env.ANTHROPIC_API_KEY != ''
        uses: actions/checkout@v4
      - if: env.ANTHROPIC_API_KEY != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: env.ANTHROPIC_API_KEY != ''
        run: npm ci
      - if: env.ANTHROPIC_API_KEY != ''
        run: npm run eval:kanji -- --n 15 --runs 1
      - if: always() && env.ANTHROPIC_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            evals/results/
            evals/failures/
          retention-days: 30
